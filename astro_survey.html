<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>천체사진 진위 판별 설문</title>
<style>
  /* ============================================================
     디자인 토큰 — 색상은 전부 여기 변수로만 관리됨.
     "프레임"(전체적인 톤/느낌)을 바꾸고 싶으면 이 :root 블록만
     건드리면 사이트 전체 색이 다 같이 바뀜. 아래에서 각 값을
     어디에 쓰는지 설명해둠.
  ============================================================ */
  :root{
    --bg: #efe9db;         /* 종이 느낌의 따뜻한 아이보리 배경 */
    --bg-soft: #e4dcc8;    /* 입력창/보조 배경 */
    --card: #faf7ef;       /* 카드(사진 박스, 관리자 패널) — 종이보다 살짝 밝게 */
    --line: #cabe9f;       /* 테두리, 구분선 — 갈색 계열 헤어라인 */
    --text: #2a241c;       /* 기본 글자색 — 잉크색(짙은 세피아 블랙) */
    --text-dim: #7a705c;   /* 보조 설명 글자색 */
    --star: #a8471f;       /* 포인트 색 1 — 버튼 강조 (테라코타/녹슨 주황) */
    --aqua: #3c6b4a;       /* 포인트 색 2 — "진짜 사진" 강조 (딥 그린) */
    --danger: #9c2f3e;     /* 경고/삭제/"AI" 관련 강조 (딥 레드) */
  }
  /* "관측 노트" 톤 — 밤하늘 다크테마 대신 실제 관측일지/필드노트 느낌으로 잡음.
     각지고 얇은 테두리, 세리프+모노스페이스 조합이 AI 생성 느낌을 줄여줌.
     다른 톤으로 바꾸려면 위 9개 색상 값만 교체하면 됨 */
  *{ box-sizing:border-box; }
  button, input, select{ font-family: inherit; } /* 버튼/입력창이 브라우저 기본 폰트로 안 떨어지고 body 폰트를 따라가게 함 */
  html,body{ height:100%; }
  /* body 배경 — 별 대신 얇은 격자(그래프 용지/성도 느낌)를 깖 */
  body{
    margin:0;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: -1px -1px;
    background-blend-mode: normal;
    color: var(--text);
    font-family: "Pretendard", "Noto Sans KR", sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100%;
    padding: 28px 16px 60px;
  }
  .wrap{ width:100%; max-width:460px; } /* 전체 콘텐츠 폭 제한 — 모바일 카드 느낌 */

  /* ---------- 상단 헤더 (제목 + 그만하기 버튼) ---------- */
  header{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom: 22px;
  }
  header h1{
    font-family: "Pretendard", "Noto Sans KR", sans-serif; /* 견고딕 계열 — 두께감 있는 산세리프로 톤 잡음 */
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.01em;
    margin:0;
    color: var(--text);
  }
  header button{
    background:none; border:none; color: var(--text-dim);
    font-size: 0.82rem; cursor:pointer; padding:4px;
  }
  header button:hover{ color: var(--text); }

  /* ---------- 진행 상태 바 (몇 번째 사진인지 표시) ---------- */
  .progress-track{
    height:3px; background: var(--line); border-radius:2px; overflow:hidden; margin-bottom:26px;
  }
  .progress-fill{
    height:100%; background: var(--star); transition: width .35s ease;
  }

  /* ---------- 메인 카드 (사진을 담는 박스) ----------
     .card = 둥근 모서리 박스 자체. .photo-frame = 사진이 들어가는 4:3 틀.
     "AI스러운 프레임" 느낌을 바꾸려면 이 border-radius(둥근 정도)나
     .card의 border/그림자를 먼저 만져보는 걸 추천 — 지금은 border만
     있고 그림자(box-shadow)가 없어서 좀 납작해 보일 수 있음 */
  .card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 18px;
  }
  .photo-frame{
    width:100%;
    aspect-ratio: 4/3;         /* 사진 비율 고정 — 세로 사진 위주면 3/4 등으로 조정 */
    border-radius: 3px;
    overflow:hidden;
    background:#000;
    margin-bottom: 18px;
    position:relative;
  }
  .photo-frame img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .counter{
    text-align:center; font-size:0.78rem; color: var(--text-dim); margin-bottom:14px;
    font-family: "SF Mono", "Courier New", monospace; letter-spacing:0.03em; /* 계기판/로그 느낌 */
  }
  .question{
    text-align:center; font-size:1.02rem; margin: 0 0 20px; color: var(--text);
  }
  /* ---------- O / X 선택 버튼 ---------- */
  .choices{
    display:grid; grid-template-columns: 1fr 1fr; gap:10px;
  }
  .choice-btn{
    padding: 16px 8px;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: var(--bg-soft);
    color: var(--text);
    font-size: 0.95rem;
    cursor:pointer;
    transition: border-color .15s, transform .1s;
    line-height:1.4;
  }
  .choice-btn:active{ transform: scale(0.98); }
  .choice-btn.ai:hover{ border-color: var(--danger); }
  .choice-btn.real:hover{ border-color: var(--aqua); }
  .choice-btn small{ display:block; color:var(--text-dim); font-size:0.8rem; margin-top:4px; font-family: "SF Mono", "Courier New", monospace; letter-spacing:0.05em; }

  /* ---------- 설문 종료 화면 ---------- */
  .end-screen{
    text-align:center; padding: 50px 20px;
  }
  .end-screen h2{
    font-family: "Pretendard", "Noto Sans KR", sans-serif; font-weight:700; font-size:1.3rem; margin-bottom:10px;
  }
  .end-screen p{ color: var(--text-dim); font-size:0.92rem; line-height:1.6; }
  .end-tagline{
    margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line);
    font-size: 0.82rem !important; color: var(--star) !important; line-height:1.7 !important;
    font-style: italic;
  }

  /* ---------- 맨 아래 "관리자" 링크 ---------- */
  footer{
    margin-top: 36px; text-align:center;
  }
  footer button{
    background:none; border:none; color: var(--text-dim); font-size:0.78rem;
    text-decoration: underline; text-underline-offset:3px; cursor:pointer;
  }

  /* ============================================================
     관리자 화면 (비밀번호 입력 → 사진 관리 / 결과 보기)
     참여자용 화면과는 완전히 분리된 별도 레이어(오버레이)로 뜸.
     참여자가 볼 일 없는 영역이라 "AI스러움"보다 기능 위주 디자인.
  ============================================================ */
  .admin-overlay{
    position:fixed; inset:0; background: rgba(26,20,12,0.88); /* 뒷배경 어둡게 깔아서 모달처럼 보이게 (세피아 톤) */
    display:flex; align-items:flex-start; justify-content:center;
    overflow-y:auto; padding: 40px 16px; z-index:10;
  }
  .admin-panel{
    background: var(--card); border:1px solid var(--line); border-radius:5px;
    max-width: 640px; width:100%; padding:24px;
  }
  .admin-panel h2{ font-family: "Pretendard", "Noto Sans KR", sans-serif; font-weight:700; margin-top:0; }
  .admin-panel-header{
    display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:6px;
  }
  .admin-panel-header h2{ margin:0; }
  .admin-close{
    background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:0.85rem;
    flex-shrink:0;
  }
  /* 결과 표(이미지별 O/X 득표수 표) — 헤더는 모노스페이스로 계기판/로그 느낌 */
  table.summary{ width:100%; border-collapse:collapse; margin: 16px 0; font-size:0.85rem; }
  table.summary th, table.summary td{
    border-bottom: 1px solid var(--line); padding:7px 6px; text-align:left;
  }
  table.summary th{
    color: var(--text-dim); font-weight:500;
    font-family: "SF Mono", "Courier New", monospace; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em;
  }
  table.summary td{ font-family: "SF Mono", "Courier New", monospace; font-size:0.82rem; }
  .admin-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .admin-actions button{
    background: var(--bg-soft); border:1px solid var(--line); color:var(--text);
    padding:9px 14px; border-radius:3px; font-size:0.83rem; cursor:pointer;
  }
  .admin-actions button:hover{ border-color: var(--star); }
  .overall-stat{
    font-size:0.85rem; color: var(--text-dim); margin-bottom:6px;
  }
  .overall-stat b{ color: var(--star); font-weight:600; font-family: "SF Mono", "Courier New", monospace; }

  /* "사진 관리" / "결과 보기" 탭 전환 버튼 */
  .tabs{ display:flex; gap:6px; margin: 14px 0 18px; }
  .tab-btn{
    background: var(--bg-soft); border:1px solid var(--line); color: var(--text-dim);
    padding:7px 14px; border-radius:3px; font-size:0.82rem; cursor:pointer;
  }
  .tab-btn.active{ color: var(--text); border-color: var(--star); }

  /* 사진 업로드 폼 (파일 선택 + AI/실제 선택 + 추가하기 버튼) */
  .upload-box{
    border: 1px dashed var(--line); border-radius:3px; padding:16px; margin-bottom:18px;
  }
  .upload-row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .upload-row select, .upload-row input[type=file]{
    background: var(--bg-soft); color:var(--text); border:1px solid var(--line);
    border-radius:3px; padding:7px 9px; font-size:16px; /* 16px 유지 — 이보다 작으면 아이폰에서 탭할 때 화면이 확대됨 */
  }
  #pwInput{ font-size:16px; }
  .upload-row button{
    background: var(--star); color:#faf7ef; border:none; border-radius:3px;
    padding:8px 14px; font-size:0.83rem; font-weight:600; cursor:pointer;
  }
  .upload-row button:disabled{ opacity:0.5; cursor:default; }
  .upload-hint{ font-size:0.76rem; color: var(--text-dim); }

  /* 업로드된 사진 목록 (썸네일 + AI/실제 태그 + 삭제 버튼) */
  .image-list{ display:flex; flex-direction:column; gap:8px; max-height:340px; overflow-y:auto; }
  .image-row{
    display:flex; align-items:center; gap:10px; border:1px solid var(--line);
    border-radius:3px; padding:8px;
  }
  .image-row img{ width:56px; height:42px; object-fit:cover; border-radius:2px; flex-shrink:0; }
  .image-row .meta{ flex:1; font-size:0.82rem; }
  .image-row .meta .tag{
    display:inline-block; font-size:0.72rem; padding:1px 7px; border-radius:2px; margin-top:3px;
  }
  .tag.AI{ background: rgba(156,47,62,0.12); color: var(--danger); }
  .tag.REAL{ background: rgba(60,107,74,0.12); color: var(--aqua); }
  .image-row button{
    background:none; border:1px solid var(--line); color: var(--text-dim);
    border-radius:3px; padding:5px 9px; font-size:0.76rem; cursor:pointer;
  }
  .image-row button:hover{ color: var(--danger); border-color: var(--danger); }

  .loading-screen{ text-align:center; padding:60px 20px; color: var(--text-dim); }

  /* ---------- 시작 화면(연구 소개) 카드 ---------- */
  .intro-card{ padding: 24px 22px; }
  .intro-eyebrow{
    font-size:0.72rem; color: var(--star); margin: 0 0 10px; letter-spacing:0.08em;
    font-family: "SF Mono", "Courier New", monospace; text-transform: uppercase;
  }
  .intro-title{
    font-family: "Pretendard", "Noto Sans KR", sans-serif; font-weight:700;
    font-size: 1.25rem; line-height:1.4; margin: 0 0 14px; color: var(--text);
  }
  .intro-text{
    font-size: 0.92rem; line-height:1.7; color: var(--text-dim); margin: 0 0 16px;
  }
  .intro-list{
    margin: 0 0 22px; padding-left: 18px; color: var(--text-dim); font-size: 0.86rem; line-height:1.9;
  }
  .intro-list li::marker{ color: var(--aqua); }
  .intro-start{
    width:100%; padding: 15px; border-radius:3px; border:none;
    background: var(--star); color:#faf7ef; font-size:1rem; font-weight:600; cursor:pointer;
  }
  .intro-start:hover{ filter: brightness(1.05); }

  /* ---------- 좁은 화면(모바일) 보정 — 360px 이하일 때만 적용 ---------- */
  @media (max-width: 360px){
    body{ padding: 20px 12px 50px; }
    .card{ padding: 14px; }
    .choices{ grid-template-columns: 1fr; } /* O/X 버튼을 세로로 쌓음 */
    header h1{ font-size: 0.95rem; }
    .admin-panel{ padding: 18px 14px; }
    .upload-row{ flex-direction: column; align-items: stretch; }
    .upload-row select, .upload-row input[type=file], .upload-row button{ width: 100%; }
  }
</style>
</head>
<body>
  <div class="wrap" id="app"></div>

  <footer>
    <button id="adminLink">관리자 · 결과 보기</button>
  </footer>

  <div id="adminOverlay" class="admin-overlay" style="display:none;"></div>

<script>
/* ============================================================
   전체 구조 지도 (디자인/기능 수정할 때 참고용)
   1. 상수/설정        — ADMIN_PASSWORD, SHEET_WEBAPP_URL
   2. 저장소 통신 함수   — postResponse / fetchAllResponses / fetchImages / postImage / postDeleteImage
   3. 데모 이미지 생성   — makeDemoImage, DEMO_IMAGES (사진 없을 때 대신 보여주는 별그림)
   4. 참여자 화면 흐름   — renderIntro → startQuiz → renderQuestion → submitAnswer → renderEnd
   5. 관리자 화면        — showPasswordGate → openAdmin → renderAdminPhotos / renderAdminResults
   6. CSV/TXT 내보내기   — toCSV, buildTXTReport, downloadCSV, downloadTXT
   "프레임(디자인)"만 바꾸고 싶으면 4번 함수들이 만드는 HTML 구조(innerHTML 템플릿)와
   위쪽 <style> 태그만 건드리면 됨 — 3·5·6번은 기능(로직)이라 안 건드려도 됨.
============================================================ */
const ADMIN_PASSWORD = 'kt45181781+';

/* 구글 Apps Script 웹앱 URL — 배포 후 이 자리에 붙여넣으세요.
   (README.md의 "Apps Script 배포하기" 절차대로 배포하면 URL이 생성됨) */
const SHEET_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyHoR4umf6EwRWx8TA_r22CG7jkehnCe6Ou9UA_FOQZLwPjZJDZ8VDQxOHyohPot1p7mw/exec';

function sheetConfigured(){
  return SHEET_WEBAPP_URL && !SHEET_WEBAPP_URL.startsWith('PASTE_');
}

/* 응답 제출: POST. Apps Script 웹앱은 CORS 프리플라이트를 지원하지 않으므로
   text/plain으로 보내고(단순 요청) 응답은 읽지 않는다(no-cors, fire-and-forget). */
async function postResponse(record){
  if(!sheetConfigured()) throw new Error('아직 저장소가 연결되지 않았어요 (SHEET_WEBAPP_URL 미설정)');
  await fetch(SHEET_WEBAPP_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(record)
  });
}

/* 결과 조회: GET. Apps Script doGet은 전체 응답 로그를 JSON 배열로 반환. */
async function fetchAllResponses(){
  if(!sheetConfigured()) throw new Error('아직 저장소가 연결되지 않았어요 (SHEET_WEBAPP_URL 미설정)');
  const res = await fetch(SHEET_WEBAPP_URL, { method: 'GET' });
  if(!res.ok) throw new Error('결과를 불러오지 못했어요 (' + res.status + ')');
  const data = await res.json();
  return Array.isArray(data) ? data : [];
}

/* 사진 목록 조회: GET ?type=images. [{id, truth, url}] 형태로 반환. */
async function fetchImages(){
  if(!sheetConfigured()) return [];
  try{
    const res = await fetch(SHEET_WEBAPP_URL + '?type=images', { method: 'GET', cache: 'no-store' });
    if(!res.ok) return [];
    const data = await res.json();
    return Array.isArray(data) ? data : [];
  }catch(e){
    return [];
  }
}

/* 사진 업로드: POST (no-cors, 응답 확인 불가 — 업로드 후 목록을 다시 불러와서 확인). */
async function postImage({ id, truth, mimeType, dataBase64 }){
  if(!sheetConfigured()) throw new Error('아직 저장소가 연결되지 않았어요 (SHEET_WEBAPP_URL 미설정)');
  await fetch(SHEET_WEBAPP_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ type: 'image', id, truth, mimeType, dataBase64 })
  });
}

/* 사진 삭제: POST (no-cors). */
async function postDeleteImage(id){
  if(!sheetConfigured()) throw new Error('아직 저장소가 연결되지 않았어요 (SHEET_WEBAPP_URL 미설정)');
  await fetch(SHEET_WEBAPP_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ type: 'deleteImage', id })
  });
}

/* 데모용 별자리 이미지 (관리자가 사진을 하나도 올리지 않았을 때만 사용) */
function makeDemoImage(seed, label){
  const c = document.createElement('canvas');
  c.width = 480; c.height = 360;
  const ctx = c.getContext('2d');
  let s = seed;
  function rnd(){ s = (s * 9301 + 49297) % 233280; return s / 233280; }
  const g = ctx.createLinearGradient(0,0,480,360);
  g.addColorStop(0, `hsl(${(seed*37)%360},45%,10%)`);
  g.addColorStop(1, `hsl(${(seed*71)%360},55%,4%)`);
  ctx.fillStyle = g; ctx.fillRect(0,0,480,360);
  for(let i=0;i<160;i++){
    const x = rnd()*480, y = rnd()*360, r = rnd()*1.6;
    ctx.globalAlpha = 0.4 + rnd()*0.6;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = '13px sans-serif';
  ctx.fillText('DEMO · ' + label, 12, 344);
  return c.toDataURL();
}
const DEMO_IMAGES = [
  { id:'demo1', truth:'REAL', src: makeDemoImage(3,'sample 1') },
  { id:'demo2', truth:'AI',   src: makeDemoImage(11,'sample 2') },
  { id:'demo3', truth:'REAL', src: makeDemoImage(27,'sample 3') },
  { id:'demo4', truth:'AI',   src: makeDemoImage(42,'sample 4') },
];

const sessionId = Math.random().toString(36).slice(2) + Date.now().toString(36);
const app = document.getElementById('app');
let queue = [];
let pos = 0;
let usingDemo = false;

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

/* ============================================================

async function loadImagesForQuiz(){
  const images = await fetchImages();
  if(images.length === 0){
    usingDemo = true;
    return DEMO_IMAGES;
  }
  usingDemo = false;
  return images.map(entry => ({ id: entry.id, truth: entry.truth, src: entry.url }));
}

async function startQuiz(){
  app.innerHTML = `<div class="loading-screen">사진을 불러오는 중...</div>`;
  const images = await loadImagesForQuiz();
  queue = shuffle([...images]);
  pos = 0;
  renderQuestion();
}

function renderQuestion(){
  if(pos >= queue.length){ renderEnd(); return; }
  const img = queue[pos];
  app.innerHTML = `
    <header>
      <h1>이 사진, AI가 만들었을까요?</h1>
      <button id="quitBtn">그만하기</button>
    </header>
    <div class="progress-track"><div class="progress-fill" style="width:${(pos/queue.length)*100}%"></div></div>
    ${!sheetConfigured() ? '<p class="upload-hint" style="margin-bottom:10px; color:var(--danger);">⚠ 저장소가 아직 연결되지 않았어요 · 응답이 기록되지 않아요 (SHEET_WEBAPP_URL 설정 필요)</p>' : ''}
    ${usingDemo ? '<p class="upload-hint" style="margin-bottom:10px;">지금은 데모 이미지예요 · 관리자 화면에서 실제 사진을 올려주세요</p>' : ''}
    <div class="card">
      <div class="photo-frame"><img src="${img.src}" alt="판별할 사진"></div>
      <div class="counter">${pos+1} / ${queue.length}</div>
      <p class="question">직접 촬영한 천체사진일까요, AI가 만든 이미지일까요?</p>
      <div class="choices">
        <button class="choice-btn real" data-guess="REAL">직접 찍은 사진<small>O</small></button>
        <button class="choice-btn ai" data-guess="AI">AI가 만든 사진<small>X</small></button>
      </div>
    </div>
  `;
  document.getElementById('quitBtn').onclick = () => renderEnd(true);
  app.querySelectorAll('.choice-btn').forEach(btn=>{
    btn.onclick = () => submitAnswer(img, btn.dataset.guess);
  });
}

async function submitAnswer(img, guess){
  const correct = guess === img.truth;
  const record = {
    session: sessionId, imageId: img.id, truth: img.truth,
    guess, correct, ts: new Date().toISOString()
  };
  try{ await postResponse(record); }
  catch(e){ console.error('저장 실패', e); }
  pos++;
  renderQuestion();
}

const MAX_DIMENSION = 1400;
const JPEG_QUALITY = 0.85;

function loadViaImageElement(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('이미지를 디코딩할 수 없어요'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('파일을 읽는 데 실패했어요'));
    reader.readAsDataURL(file);
  });
}

/* 업로드한 사진을 리사이즈해서 base64(순수 데이터만, 접두어 제외)로 반환 */
async function resizeImageFile(file){
  const isImageType = /^image\//.test(file.type || '');
  const looksLikeImage = /\.(jpe?g|png)$/i.test(file.name || '');
  if(!isImageType && !looksLikeImage){
    throw new Error('이미지 파일(jpg, jpeg, png)만 올릴 수 있어요');
  }

  let source;
  try{ source = await createImageBitmap(file); }
  catch(e){ source = await loadViaImageElement(file); }

  let width = source.width, height = source.height;
  if(!width || !height){ throw new Error('이미지 크기를 읽을 수 없어요'); }
  if(width > MAX_DIMENSION || height > MAX_DIMENSION){
    if(width > height){ height = Math.round(height * MAX_DIMENSION / width); width = MAX_DIMENSION; }
    else{ width = Math.round(width * MAX_DIMENSION / height); height = MAX_DIMENSION; }
  }

  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, width, height);
  ctx.drawImage(source, 0, 0, width, height);
  if(source.close) source.close();

  const dataUrl = canvas.toDataURL('image/jpeg', JPEG_QUALITY);
  return dataUrl.split(',')[1]; // "data:image/jpeg;base64," 접두어 제거
}

function summarize(responses, images){
  const byImage = {};
  images.forEach(img => { byImage[img.id] = { id: img.id, truth: img.truth, shown:0, real:0, ai:0, correct:0 }; });
  responses.forEach(r=>{
    if(!byImage[r.imageId]) byImage[r.imageId] = { id:r.imageId, truth:r.truth, shown:0, real:0, ai:0, correct:0 };
    byImage[r.imageId].shown++;
    if(r.guess === 'REAL') byImage[r.imageId].real++;
    else if(r.guess === 'AI') byImage[r.imageId].ai++;
    if(r.correct) byImage[r.imageId].correct++;
  });
  return Object.values(byImage);
}

function toCSV(rows, headers){
  const esc = v => `"${String(v).replace(/"/g,'""')}"`;
  const lines = [headers.map(esc).join(',')];
  rows.forEach(r => lines.push(headers.map(h=>esc(r[h] ?? '')).join(',')));
  return lines.join('\n');
}

function downloadCSV(text, filename){
  const blob = new Blob(['\uFEFF' + text], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  else await renderAdminResults(overlay);

async function renderAdminPhotos(overlay){
  overlay.innerHTML = `<div class="admin-panel"><p class="upload-hint">불러오는 중...</p></div>`;
  const images = await fetchImages();

  const rowsHTML = images.map(entry => `
    <div class="image-row" data-id="${entry.id}">
      <img src="${entry.url}" alt="">
      <div class="meta">${entry.id}<br><span class="tag ${entry.truth}">${entry.truth === 'AI' ? 'AI 이미지' : '실제 사진'}</span></div>

    </div>
  `).join('');

  overlay.innerHTML = `
    <div class="admin-panel">
      <div class="admin-panel-header">
        <h2>사진 관리</h2>
        <button class="admin-close" id="adminClose">닫기</button>
      </div>
      <div class="tabs">
        <button class="tab-btn active" data-tab="photos">사진 관리</button>
        <button class="tab-btn" data-tab="results">결과 보기</button>
      </div>
      ${!sheetConfigured() ? '<p class="upload-hint" style="color:var(--danger); margin-bottom:12px;">⚠ 저장소가 아직 연결되지 않았어요 (SHEET_WEBAPP_URL 미설정)</p>' : ''}
      <div class="upload-box">
        <div class="upload-row">
          <input type="file" id="fileInput" accept="image/jpeg,image/png,image/jpg,.jpg,.jpeg,.png">
          <select id="truthSelect">
            <option value="REAL">실제로 찍은 사진</option>
            <option value="AI">AI가 만든 사진</option>
          </select>
          <button id="uploadBtn">추가하기</button>
        </div>
        <div class="upload-hint">사진은 자동으로 리사이즈돼서 구글 드라이브에 저장돼요 (최장 변 ${MAX_DIMENSION}px)</div>
        <p id="uploadMsg" style="color:var(--danger); font-size:0.8rem; display:none; margin:8px 0 0;"></p>
      </div>
      <div class="image-list" id="imageList">
        ${rowsHTML || '<p class="upload-hint">등록된 사진이 없어요. 위에서 업로드해주세요. (지금은 데모 이미지가 대신 보여요)</p>'}
      </div>
      <div class="admin-actions">
        <button id="refreshPhotos">새로고침</button>
      </div>
    </div>
  `;
  bindAdminChrome(overlay);
  overlay.querySelector('#refreshPhotos').onclick = () => renderAdminPhotos(overlay);

  const uploadBtn = overlay.querySelector('#uploadBtn');
  const uploadMsg = overlay.querySelector('#uploadMsg');
  const showUploadMsg = (text) => { uploadMsg.textContent = text; uploadMsg.style.display = 'block'; };

  uploadBtn.onclick = async () => {
    const fileInput = overlay.querySelector('#fileInput');
    const truth = overlay.querySelector('#truthSelect').value;
    const file = fileInput.files[0];
    if(!file){ showUploadMsg('사진 파일을 선택해주세요.'); return; }
    uploadMsg.style.display = 'none';
    uploadBtn.disabled = true;
    uploadBtn.textContent = '업로드 중...';
    try{
      const base64 = await resizeImageFile(file);
      const id = 'img_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      await postImage({ id, truth, mimeType: 'image/jpeg', dataBase64: base64 });

  overlay.querySelectorAll('[data-del]').forEach(btn=>{

            btn.textContent = original;

        return;

      btn.disabled = true;
      try{
        await postDeleteImage(id);
        await new Promise(r => setTimeout(r, 1500));
        await renderAdminPhotos(overlay);
      }catch(e){
        btn.disabled = false;
        btn.textContent = '삭제';
      }
    };
  });
}

async function renderAdminResults(overlay){
  const images = await fetchImages();
  const imagesForSummary = images.length ? images.map(e=>({id:e.id, truth:e.truth})) : DEMO_IMAGES;

  let responses = [];
  let fetchError = null;
  try{
    responses = await fetchAllResponses();
  }catch(e){
    fetchError = (e && e.message) ? e.message : '결과를 불러오지 못했어요';
  }

  const summary = summarize(responses, imagesForSummary);
  const totalAnswers = responses.length;
  const totalCorrect = responses.filter(r=>r.correct).length;
  const overallRate = totalAnswers ? Math.round((totalCorrect/totalAnswers)*1000)/10 : 0;
  const sessions = new Set(responses.map(r=>r.session)).size;

  const rowsHTML = summary.map(s=>{
    const rate = s.shown ? Math.round((s.correct/s.shown)*1000)/10 : 0;
    return `<tr><td>${s.id}</td><td>${s.truth === 'REAL' ? '진짜 사진' : 'AI 사진'}</td><td>${s.shown}</td><td>${s.real}</td><td>${s.ai}</td><td>${rate}%</td></tr>`;
  }).join('');

  overlay.innerHTML = `
    <div class="admin-panel">
      ${fetchError ? `<p class="upload-hint" style="color:var(--danger); margin-bottom:12px;">⚠ ${fetchError}</p>` : ''}      <div class="admin-panel-header">
        <h2>응답 결과</h2>
        <button class="admin-close" id="adminClose">닫기</button>
      </div>
      <div class="tabs">
        <button class="tab-btn" data-tab="photos">사진 관리</button>
        <button class="tab-btn active" data-tab="results">결과 보기</button>
      </div>
      <div class="overall-stat">참여 세션 <b>${sessions}</b>개 · 총 응답 <b>${totalAnswers}</b>건</div>
      <div class="overall-stat">전체 정답률 <b>${overallRate}%</b></div>
      <table class="summary">
        <thead><tr><th>이미지</th><th>실제로는</th><th>총 클릭수</th><th>O (진짜라고 답함)</th><th>X (AI라고 답함)</th><th>정답률</th></tr></thead>
        <tbody>${rowsHTML || '<tr><td colspan="6">아직 응답이 없습니다</td></tr>'}</tbody>
      </table>
      <div class="admin-actions">
        <button id="csvRaw">전체 응답 로그 CSV</button>
        <button id="csvSummary">이미지별 요약 CSV</button>
        <button id="txtSummary">통계 텍스트 저장</button>
        <button id="refresh">새로고침</button>
      </div>
    </div>
  `;
  bindAdminChrome(overlay);
  overlay.querySelector('#refresh').onclick = () => renderAdminResults(overlay);
  overlay.querySelector('#csvRaw').onclick = () => {
    const csv = toCSV(responses, ['session','imageId','truth','guess','correct','ts']);
    downloadCSV(csv, 'astro_survey_raw.csv');
  };
  overlay.querySelector('#csvSummary').onclick = () => {
    const csv = toCSV(summary.map(s=>({
      imageId:s.id, truth:s.truth, shown:s.shown, real:s.real, ai:s.ai, correct:s.correct,
      accuracy: s.shown ? Math.round((s.correct/s.shown)*1000)/10 + '%' : '0%'
    })), ['imageId','truth','shown','real','ai','correct','accuracy']);
    downloadCSV(csv, 'astro_survey_summary.csv');
  };
  overlay.querySelector('#txtSummary').onclick = () => {
    downloadTXT(buildTXTReport(summary, sessions, totalAnswers, totalCorrect, overallRate), 'astro_survey_stats.txt');
  };
}

function buildTXTReport(summary, sessions, totalAnswers, totalCorrect, overallRate){
  const lines = [];
  lines.push('AI 천체사진 판별 설문 - 득표 결과');
  lines.push('생성 시각: ' + new Date().toLocaleString('ko-KR'));
  lines.push(`참여 세션 수: ${sessions} · 총 응답 수: ${totalAnswers} · 전체 정답률: ${overallRate}%`);
  lines.push('');
  summary.forEach(s=>{
    lines.push(`제목: ${s.id}`);
    lines.push(`정답: ${s.truth === 'AI' ? 'AI' : '사진'}`);
    lines.push(`AI득표수: ${s.ai}`);
    lines.push(`사진득표수: ${s.real}`);
    lines.push('');
  });
  return lines.join('\n');
}

function downloadTXT(text, filename){
  const blob = new Blob(['\uFEFF' + text], { type:'text/plain;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function bindAdminChrome(overlay){
  overlay.querySelector('#adminClose').onclick = () => {
    overlay.style.display = 'none';
    startQuiz(); // 관리자가 사진을 바꿨을 수 있으니 새로 불러오기
  };
  overlay.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.onclick = async () => {
      adminTab = btn.dataset.tab;
      if(adminTab === 'photos') await renderAdminPhotos(overlay);
      else await renderAdminResults(overlay);
    };
  });
}
