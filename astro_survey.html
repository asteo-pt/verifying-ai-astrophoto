<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>천체사진 진위 판별 설문</title>
<style>
  :root{
    --bg: #0d1120;
    --bg-soft: #131a30;
    --card: #171f3a;
    --line: #2a3358;
    --text: #e9ecf5;
    --text-dim: #9aa3c4;
    --star: #f2c879;
    --aqua: #6fe3c4;
    --danger: #e8748a;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,.4) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 85% 20%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,.35) 50%, transparent 51%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Noto Sans KR", sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100%;
    padding: 28px 16px 60px;
  }
  .wrap{ width:100%; max-width:460px; }
  header{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom: 22px;
  }
  header h1{
    font-family: Georgia, "Noto Serif KR", serif;
    font-weight: 500;
    font-size: 1.05rem;
    letter-spacing: 0.01em;
    margin:0;
    color: var(--text);
  }
  header button{
    background:none; border:none; color: var(--text-dim);
    font-size: 0.82rem; cursor:pointer; padding:4px;
  }
  header button:hover{ color: var(--text); }

  .progress-track{
    height:3px; background: var(--line); border-radius:2px; overflow:hidden; margin-bottom:26px;
  }
  .progress-fill{
    height:100%; background: var(--star); transition: width .35s ease;
  }

  .card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px;
  }
  .photo-frame{
    width:100%;
    aspect-ratio: 4/3;
    border-radius: 12px;
    overflow:hidden;
    background:#000;
    margin-bottom: 18px;
    position:relative;
  }
  .photo-frame img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .counter{
    text-align:center; font-size:0.82rem; color: var(--text-dim); margin-bottom:14px;
  }
  .question{
    text-align:center; font-size:1.02rem; margin: 0 0 20px; color: var(--text);
  }
  .choices{
    display:grid; grid-template-columns: 1fr 1fr; gap:10px;
  }
  .choice-btn{
    padding: 16px 8px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--bg-soft);
    color: var(--text);
    font-size: 0.95rem;
    cursor:pointer;
    transition: border-color .15s, transform .1s;
    line-height:1.4;
  }
  .choice-btn:active{ transform: scale(0.98); }
  .choice-btn.ai:hover{ border-color: var(--danger); }
  .choice-btn.real:hover{ border-color: var(--aqua); }
  .choice-btn small{ display:block; color:var(--text-dim); font-size:0.75rem; margin-top:4px; }

  .end-screen{
    text-align:center; padding: 50px 20px;
  }
  .end-screen h2{
    font-family: Georgia, "Noto Serif KR", serif; font-weight:500; font-size:1.3rem; margin-bottom:10px;
  }
  .end-screen p{ color: var(--text-dim); font-size:0.92rem; line-height:1.6; }

  footer{
    margin-top: 36px; text-align:center;
  }
  footer button{
    background:none; border:none; color: var(--text-dim); font-size:0.78rem;
    text-decoration: underline; text-underline-offset:3px; cursor:pointer;
  }

  /* admin */
  .admin-overlay{
    position:fixed; inset:0; background: rgba(6,8,16,0.92);
    display:flex; align-items:flex-start; justify-content:center;
    overflow-y:auto; padding: 40px 16px; z-index:10;
  }
  .admin-panel{
    background: var(--card); border:1px solid var(--line); border-radius:16px;
    max-width: 640px; width:100%; padding:24px;
  }
  .admin-panel h2{ font-family: Georgia, serif; font-weight:500; margin-top:0; }
  .admin-panel-header{
    display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:6px;
  }
  .admin-panel-header h2{ margin:0; }
  .admin-close{
    background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:0.85rem;
    flex-shrink:0;
  }
  table.summary{ width:100%; border-collapse:collapse; margin: 16px 0; font-size:0.85rem; }
  table.summary th, table.summary td{
    border-bottom: 1px solid var(--line); padding:7px 6px; text-align:left;
  }
  table.summary th{ color: var(--text-dim); font-weight:500; }
  .admin-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .admin-actions button{
    background: var(--bg-soft); border:1px solid var(--line); color:var(--text);
    padding:9px 14px; border-radius:9px; font-size:0.83rem; cursor:pointer;
  }
  .admin-actions button:hover{ border-color: var(--star); }
  .overall-stat{
    font-size:0.85rem; color: var(--text-dim); margin-bottom:6px;
  }
  .overall-stat b{ color: var(--star); font-weight:600; }

  .tabs{ display:flex; gap:6px; margin: 14px 0 18px; }
  .tab-btn{
    background: var(--bg-soft); border:1px solid var(--line); color: var(--text-dim);
    padding:7px 14px; border-radius:20px; font-size:0.82rem; cursor:pointer;
  }
  .tab-btn.active{ color: var(--text); border-color: var(--star); }

  .upload-box{
    border: 1px dashed var(--line); border-radius:12px; padding:16px; margin-bottom:18px;
  }
  .upload-row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .upload-row select, .upload-row input[type=file]{
    background: var(--bg-soft); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:7px 9px; font-size:16px;
  }
  #pwInput{ font-size:16px; }
  .upload-row button{
    background: var(--star); color:#1a1508; border:none; border-radius:8px;
    padding:8px 14px; font-size:0.83rem; font-weight:600; cursor:pointer;
  }
  .upload-row button:disabled{ opacity:0.5; cursor:default; }
  .upload-hint{ font-size:0.76rem; color: var(--text-dim); }

  .image-list{ display:flex; flex-direction:column; gap:8px; max-height:340px; overflow-y:auto; }
  .image-row{
    display:flex; align-items:center; gap:10px; border:1px solid var(--line);
    border-radius:10px; padding:8px;
  }
  .image-row img{ width:56px; height:42px; object-fit:cover; border-radius:6px; flex-shrink:0; }
  .image-row .meta{ flex:1; font-size:0.82rem; }
  .image-row .meta .tag{
    display:inline-block; font-size:0.72rem; padding:1px 7px; border-radius:10px; margin-top:3px;
  }
  .tag.AI{ background: rgba(232,116,138,0.18); color: var(--danger); }
  .tag.REAL{ background: rgba(111,227,196,0.18); color: var(--aqua); }
  .image-row button{
    background:none; border:1px solid var(--line); color: var(--text-dim);
    border-radius:7px; padding:5px 9px; font-size:0.76rem; cursor:pointer;
  }
  .image-row button:hover{ color: var(--danger); border-color: var(--danger); }

  .loading-screen{ text-align:center; padding:60px 20px; color: var(--text-dim); }

  .intro-card{ padding: 24px 22px; }
  .intro-eyebrow{
    font-size:0.78rem; color: var(--star); margin: 0 0 10px; letter-spacing:0.01em;
  }
  .intro-title{
    font-family: Georgia, "Noto Serif KR", serif; font-weight:500;
    font-size: 1.25rem; line-height:1.4; margin: 0 0 14px; color: var(--text);
  }
  .intro-text{
    font-size: 0.92rem; line-height:1.7; color: var(--text-dim); margin: 0 0 16px;
  }
  .intro-list{
    margin: 0 0 22px; padding-left: 18px; color: var(--text-dim); font-size: 0.86rem; line-height:1.9;
  }
  .intro-list li::marker{ color: var(--aqua); }
  .intro-start{
    width:100%; padding: 15px; border-radius:12px; border:none;
    background: var(--star); color:#1a1508; font-size:1rem; font-weight:600; cursor:pointer;
  }
  .intro-start:hover{ filter: brightness(1.05); }

  @media (max-width: 360px){
    body{ padding: 20px 12px 50px; }
    .card{ padding: 14px; }
    .choices{ grid-template-columns: 1fr; }
    header h1{ font-size: 0.95rem; }
    .admin-panel{ padding: 18px 14px; }
    .upload-row{ flex-direction: column; align-items: stretch; }
    .upload-row select, .upload-row input[type=file], .upload-row button{ width: 100%; }
  }
</style>
</head>
<body>
  <div class="wrap" id="app"></div>

  <footer>
    <button id="adminLink">관리자 · 결과 보기</button>
  </footer>

  <div id="adminOverlay" class="admin-overlay" style="display:none;"></div>

<script>
const ADMIN_PASSWORD = 'yaejoo2026'; // 배포 전에 반드시 바꾸세요
const MAX_DIMENSION = 1400;   // 업로드 시 리사이즈할 최장 변 (px)
const JPEG_QUALITY = 0.85;

/* window.storage는 이 페이지가 Claude 안에서 열릴 때만 주입됨.
   다운로드해서 따로 열거나 다른 곳에 올려서 열면 없기 때문에,
   여기서 감싸서 뜻 모를 TypeError 대신 안내 문구가 뜨게 함. */
const storageAvailable = typeof window !== 'undefined'
  && !!window.storage
  && typeof window.storage.get === 'function';

const NO_STORAGE_MSG = '저장 기능을 쓸 수 없어요. 이 페이지를 Claude 안(채팅에 뜬 미리보기)에서 열었는지 확인해주세요 — 다운로드한 파일을 직접 열면 저장이 안 돼요.';

const st = {
  get: (...args) => { if(!storageAvailable) return Promise.reject(new Error(NO_STORAGE_MSG)); return window.storage.get(...args); },
  set: (...args) => { if(!storageAvailable) return Promise.reject(new Error(NO_STORAGE_MSG)); return window.storage.set(...args); },
  delete: (...args) => { if(!storageAvailable) return Promise.reject(new Error(NO_STORAGE_MSG)); return window.storage.delete(...args); },
  list: (...args) => { if(!storageAvailable) return Promise.reject(new Error(NO_STORAGE_MSG)); return window.storage.list(...args); },
};

/* 데모용 별자리 이미지 (관리자가 사진을 하나도 올리지 않았을 때만 사용) */
function makeDemoImage(seed, label){
  const c = document.createElement('canvas');
  c.width = 480; c.height = 360;
  const ctx = c.getContext('2d');
  let s = seed;
  function rnd(){ s = (s * 9301 + 49297) % 233280; return s / 233280; }
  const g = ctx.createLinearGradient(0,0,480,360);
  g.addColorStop(0, `hsl(${(seed*37)%360},45%,10%)`);
  g.addColorStop(1, `hsl(${(seed*71)%360},55%,4%)`);
  ctx.fillStyle = g; ctx.fillRect(0,0,480,360);
  for(let i=0;i<160;i++){
    const x = rnd()*480, y = rnd()*360, r = rnd()*1.6;
    ctx.globalAlpha = 0.4 + rnd()*0.6;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = '13px sans-serif';
  ctx.fillText('DEMO · ' + label, 12, 344);
  return c.toDataURL();
}
const DEMO_IMAGES = [
  { id:'demo1', truth:'REAL', src: makeDemoImage(3,'sample 1') },
  { id:'demo2', truth:'AI',   src: makeDemoImage(11,'sample 2') },
  { id:'demo3', truth:'REAL', src: makeDemoImage(27,'sample 3') },
  { id:'demo4', truth:'AI',   src: makeDemoImage(42,'sample 4') },
];

const sessionId = Math.random().toString(36).slice(2) + Date.now().toString(36);
const app = document.getElementById('app');
let queue = [];
let pos = 0;
let usingDemo = false;

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

/* ============================================================
   저장된 이미지 목록 불러오기
   index 키(shared) = [{id, truth, addedAt}], 실제 데이터는 imgdata:{id}
============================================================ */
async function loadImageIndex(){
  try{
    const r = await st.get('image_index', true);
    if(r && r.value) return JSON.parse(r.value);
  }catch(e){ /* 없으면 빈 배열 */ }
  return [];
}
async function saveImageIndex(list){
  await st.set('image_index', JSON.stringify(list), true);
}
async function loadImagesForQuiz(){
  const index = await loadImageIndex();
  if(index.length === 0){
    usingDemo = true;
    return DEMO_IMAGES;
  }
  usingDemo = false;
  const loaded = [];
  for(const entry of index){
    try{
      const r = await st.get('imgdata:' + entry.id, true);
      if(r && r.value) loaded.push({ id: entry.id, truth: entry.truth, src: r.value });
    }catch(e){ /* skip missing */ }
  }
  return loaded.length ? loaded : DEMO_IMAGES;
}

async function startQuiz(){
  app.innerHTML = `<div class="loading-screen">사진을 불러오는 중...</div>`;
  const images = await loadImagesForQuiz();
  queue = shuffle([...images]);
  pos = 0;
  renderQuestion();
}

function renderQuestion(){
  if(pos >= queue.length){ renderEnd(); return; }
  const img = queue[pos];
  app.innerHTML = `
    <header>
      <h1>이 사진, AI가 만들었을까요?</h1>
      <button id="quitBtn">그만하기</button>
    </header>
    <div class="progress-track"><div class="progress-fill" style="width:${(pos/queue.length)*100}%"></div></div>
    ${!storageAvailable ? '<p class="upload-hint" style="margin-bottom:10px; color:var(--danger);">⚠ 저장 기능이 꺼져 있어요 · 응답이 기록되지 않아요 (Claude 미리보기에서 열어주세요)</p>' : ''}
    ${usingDemo ? '<p class="upload-hint" style="margin-bottom:10px;">지금은 데모 이미지예요 · 관리자 화면에서 실제 사진을 올려주세요</p>' : ''}
    <div class="card">
      <div class="photo-frame"><img src="${img.src}" alt="판별할 사진"></div>
      <div class="counter">${pos+1} / ${queue.length}</div>
      <p class="question">직접 촬영한 천체사진일까요, AI가 만든 이미지일까요?</p>
      <div class="choices">
        <button class="choice-btn real" data-guess="REAL">직접 찍은 사진<small>O</small></button>
        <button class="choice-btn ai" data-guess="AI">AI가 만든 사진<small>X</small></button>
      </div>
    </div>
  `;
  document.getElementById('quitBtn').onclick = () => renderEnd(true);
  app.querySelectorAll('.choice-btn').forEach(btn=>{
    btn.onclick = () => submitAnswer(img, btn.dataset.guess);
  });
}

async function submitAnswer(img, guess){
  const correct = guess === img.truth;
  const record = {
    session: sessionId, imageId: img.id, truth: img.truth,
    guess, correct, ts: new Date().toISOString()
  };
  const key = 'resp:' + sessionId + ':' + img.id;
  try{ await st.set(key, JSON.stringify(record), true); }
  catch(e){ console.error('저장 실패', e); }
  pos++;
  renderQuestion();
}

function renderEnd(early){
  app.innerHTML = `
    <header><h1>이 사진, AI가 만들었을까요?</h1><span></span></header>
    <div class="card end-screen">
      <h2>${early ? '여기까지 참여해주셨어요' : '설문이 끝났어요'}</h2>
      <p>답변해주셔서 감사합니다.<br>지금까지 누른 응답은 모두 반영됐어요.</p>
    </div>
  `;
}

function renderIntro(){
  app.innerHTML = `
    <header><h1>이 사진, AI가 만들었을까요?</h1><span></span></header>
    <div class="card intro-card">
      <p class="intro-eyebrow">AI 천체사진 판별 설문</p>
      <h2 class="intro-title">AI가 만든 천체사진, 사람을 속일 수 있을까요?</h2>
      <p class="intro-text">
        이 설문은 실제로 촬영된 천체사진과 AI가 생성한 이미지를 사람이 구분할 수 있는지
        알아보는 연구예요. 사진을 한 장씩 보고, 직접 촬영한 사진인지 AI가 만든 이미지인지
        판단해서 눌러주시면 돼요.
      </p>
      <ul class="intro-list">
        <li>정답은 알려드리지 않아요 — 맞았는지 틀렸는지는 연구 목적으로만 쓰여요</li>
        <li>이름, 이메일 등 개인정보는 전혀 수집하지 않아요</li>
        <li>사진 순서는 무작위이고, 언제든 중간에 그만둬도 그때까지 응답은 반영돼요</li>
        <li>사진 한 장당 몇 초면 충분해요</li>
      </ul>
      <button id="startBtn" class="intro-start">설문 시작하기</button>
    </div>
  `;
  document.getElementById('startBtn').onclick = startQuiz;
}

renderIntro();

/* ============================================================
   관리자 패널 (사진 관리 + 결과 보기)
============================================================ */
let adminTab = 'photos';

document.getElementById('adminLink').onclick = () => {
  showPasswordGate();
};

function showPasswordGate(){
  const overlay = document.getElementById('adminOverlay');
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div class="admin-panel">
      <div class="admin-panel-header">
        <h2>관리자 로그인</h2>
        <button class="admin-close" id="gateClose">닫기</button>
      </div>
      <div class="upload-row">
        <input type="password" id="pwInput" placeholder="비밀번호" style="flex:1;">
        <button id="pwSubmit">입장</button>
      </div>
      <p id="pwError" style="color:var(--danger); font-size:0.8rem; display:none; margin-top:6px;">비밀번호가 틀렸습니다.</p>
    </div>
  `;
  overlay.querySelector('#gateClose').onclick = () => { overlay.style.display = 'none'; };
  const pwInput = overlay.querySelector('#pwInput');
  const pwError = overlay.querySelector('#pwError');
  const submit = () => {
    if(pwInput.value === ADMIN_PASSWORD){
      adminTab = 'photos';
      openAdmin();
    }else{
      pwError.style.display = 'block';
      pwInput.value = '';
      pwInput.focus();
    }
  };
  overlay.querySelector('#pwSubmit').onclick = submit;
  pwInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') submit(); });
  pwInput.focus();
}

function loadViaImageElement(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('이미지를 디코딩할 수 없어요'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('파일을 읽는 데 실패했어요'));
    reader.readAsDataURL(file);
  });
}

async function resizeImageFile(file){
  const isImageType = /^image\//.test(file.type || '');
  const looksLikeImage = /\.(jpe?g|png)$/i.test(file.name || '');
  if(!isImageType && !looksLikeImage){
    throw new Error('이미지 파일(jpg, jpeg, png)만 올릴 수 있어요');
  }

  let source;
  try{
    source = await createImageBitmap(file);
  }catch(e){
    source = await loadViaImageElement(file);
  }

  let width = source.width, height = source.height;
  if(!width || !height){ throw new Error('이미지 크기를 읽을 수 없어요'); }
  if(width > MAX_DIMENSION || height > MAX_DIMENSION){
    if(width > height){ height = Math.round(height * MAX_DIMENSION / width); width = MAX_DIMENSION; }
    else{ width = Math.round(width * MAX_DIMENSION / height); height = MAX_DIMENSION; }
  }

  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000';           // PNG 투명 배경이 검은색으로 채워짐 (JPEG는 투명 미지원)
  ctx.fillRect(0, 0, width, height);
  ctx.drawImage(source, 0, 0, width, height);
  if(source.close) source.close();  // ImageBitmap 메모리 해제

  return canvas.toDataURL('image/jpeg', JPEG_QUALITY);
}

async function fetchAllResponses(){
  const list = await st.list('resp:', true);
  const keys = (list && list.keys) || [];
  const out = [];
  for(const k of keys){
    try{
      const r = await st.get(k, true);
      if(r && r.value) out.push(JSON.parse(r.value));
    }catch(e){}
  }
  return out;
}

function summarize(responses, images){
  const byImage = {};
  images.forEach(img => { byImage[img.id] = { id: img.id, truth: img.truth, shown:0, real:0, ai:0, correct:0 }; });
  responses.forEach(r=>{
    if(!byImage[r.imageId]) byImage[r.imageId] = { id:r.imageId, truth:r.truth, shown:0, real:0, ai:0, correct:0 };
    byImage[r.imageId].shown++;
    if(r.guess === 'REAL') byImage[r.imageId].real++;
    else if(r.guess === 'AI') byImage[r.imageId].ai++;
    if(r.correct) byImage[r.imageId].correct++;
  });
  return Object.values(byImage);
}

function toCSV(rows, headers){
  const esc = v => `"${String(v).replace(/"/g,'""')}"`;
  const lines = [headers.map(esc).join(',')];
  rows.forEach(r => lines.push(headers.map(h=>esc(r[h] ?? '')).join(',')));
  return lines.join('\n');
}

function downloadCSV(text, filename){
  const blob = new Blob(['\uFEFF' + text], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function openAdmin(){
  const overlay = document.getElementById('adminOverlay');
  overlay.style.display = 'flex';
  overlay.innerHTML = `<div class="admin-panel"><p>불러오는 중...</p></div>`;

  if(adminTab === 'photos') await renderAdminPhotos(overlay);
  else await renderAdminResults(overlay);
}

async function renderAdminPhotos(overlay){
  const index = await loadImageIndex();
  const rowsHTML = index.map(entry => `
    <div class="image-row" data-id="${entry.id}">
      <img src="${entry._src || ''}" data-thumb="${entry.id}">
      <div class="meta">${entry.id}<br><span class="tag ${entry.truth}">${entry.truth === 'AI' ? 'AI 이미지' : '실제 사진'}</span></div>
      <button data-del="${entry.id}">삭제</button>
    </div>
  `).join('');

  overlay.innerHTML = `
    <div class="admin-panel">
      <div class="admin-panel-header">
        <h2>사진 관리</h2>
        <button class="admin-close" id="adminClose">닫기</button>
      </div>
      <div class="tabs">
        <button class="tab-btn active" data-tab="photos">사진 관리</button>
        <button class="tab-btn" data-tab="results">결과 보기</button>
      </div>
      <div class="upload-box">
        <div class="upload-row">
          <input type="file" id="fileInput" accept="image/jpeg,image/png,image/jpg,.jpg,.jpeg,.png">
          <select id="truthSelect">
            <option value="REAL">실제로 찍은 사진</option>
            <option value="AI">AI가 만든 사진</option>
          </select>
          <button id="uploadBtn">추가하기</button>
        </div>
        <div class="upload-hint">사진은 브라우저에서 자동으로 리사이즈돼서 저장돼요 (최장 변 ${MAX_DIMENSION}px)</div>
        <p id="uploadMsg" style="color:var(--danger); font-size:0.8rem; display:none; margin:8px 0 0;"></p>
      </div>
      <div class="image-list" id="imageList">
        ${rowsHTML || '<p class="upload-hint">아직 등록된 사진이 없어요. 위에서 업로드해주세요.</p>'}
      </div>
    </div>
  `;
  bindAdminChrome(overlay);

  // 썸네일 채우기 (개별 fetch)
  for(const entry of index){
    st.get('imgdata:' + entry.id, true).then(r=>{
      const el = overlay.querySelector(`img[data-thumb="${entry.id}"]`);
      if(el && r && r.value) el.src = r.value;
    }).catch(()=>{});
  }

  const uploadBtn = overlay.querySelector('#uploadBtn');
  const uploadMsg = overlay.querySelector('#uploadMsg');
  const showUploadMsg = (text) => { uploadMsg.textContent = text; uploadMsg.style.display = 'block'; };
  uploadBtn.onclick = async () => {
    const fileInput = overlay.querySelector('#fileInput');
    const truth = overlay.querySelector('#truthSelect').value;
    const file = fileInput.files[0];
    if(!file){ showUploadMsg('사진 파일을 선택해주세요.'); return; }
    uploadMsg.style.display = 'none';
    uploadBtn.disabled = true;
    uploadBtn.textContent = '처리 중...';
    try{
      const dataUrl = await resizeImageFile(file);
      const id = 'img_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      await st.set('imgdata:' + id, dataUrl, true);
      const current = await loadImageIndex();
      current.push({ id, truth, addedAt: new Date().toISOString() });
      await saveImageIndex(current);
      await renderAdminPhotos(overlay);
    }catch(e){
      showUploadMsg((e && e.message) ? e.message : '업로드에 실패했어요. 파일 형식을 확인해주세요.');
      uploadBtn.disabled = false;
      uploadBtn.textContent = '추가하기';
    }
  };

  overlay.querySelectorAll('[data-del]').forEach(btn=>{
    btn.onclick = async () => {
      const id = btn.dataset.del;
      if(btn.dataset.confirming !== 'true'){
        btn.dataset.confirming = 'true';
        const original = btn.textContent;
        btn.textContent = '한번 더 누르면 삭제';
        btn.style.borderColor = 'var(--danger)';
        setTimeout(() => {
          if(btn.dataset.confirming === 'true' && document.body.contains(btn)){
            btn.dataset.confirming = 'false';
            btn.textContent = original;
            btn.style.borderColor = '';
          }
        }, 3000);
        return;
      }
      const current = (await loadImageIndex()).filter(e => e.id !== id);
      await saveImageIndex(current);
      try{ await st.delete('imgdata:' + id, true); }catch(e){}
      await renderAdminPhotos(overlay);
    };
  });
}

async function renderAdminResults(overlay){
  const index = await loadImageIndex();
  const images = index.length ? index : DEMO_IMAGES;
  const responses = await fetchAllResponses();
  const summary = summarize(responses, images);
  const totalAnswers = responses.length;
  const totalCorrect = responses.filter(r=>r.correct).length;
  const overallRate = totalAnswers ? Math.round((totalCorrect/totalAnswers)*1000)/10 : 0;
  const sessions = new Set(responses.map(r=>r.session)).size;

  const rowsHTML = summary.map(s=>{
    const rate = s.shown ? Math.round((s.correct/s.shown)*1000)/10 : 0;
    return `<tr><td>${s.id}</td><td>${s.truth === 'REAL' ? '진짜 사진' : 'AI 사진'}</td><td>${s.shown}</td><td>${s.real}</td><td>${s.ai}</td><td>${rate}%</td></tr>`;
  }).join('');

  overlay.innerHTML = `
    <div class="admin-panel">
      <div class="admin-panel-header">
        <h2>응답 결과</h2>
        <button class="admin-close" id="adminClose">닫기</button>
      </div>
      <div class="tabs">
        <button class="tab-btn" data-tab="photos">사진 관리</button>
        <button class="tab-btn active" data-tab="results">결과 보기</button>
      </div>
      <div class="overall-stat">참여 세션 <b>${sessions}</b>개 · 총 응답 <b>${totalAnswers}</b>건</div>
      <div class="overall-stat">전체 정답률 <b>${overallRate}%</b></div>
      <table class="summary">
        <thead><tr><th>이미지</th><th>실제로는</th><th>총 클릭수</th><th>O (진짜라고 답함)</th><th>X (AI라고 답함)</th><th>정답률</th></tr></thead>
        <tbody>${rowsHTML || '<tr><td colspan="6">아직 응답이 없습니다</td></tr>'}</tbody>
      </table>
      <div class="admin-actions">
        <button id="csvRaw">전체 응답 로그 CSV</button>
        <button id="csvSummary">이미지별 요약 CSV</button>
        <button id="txtSummary">통계 텍스트 저장</button>
        <button id="refresh">새로고침</button>
      </div>
    </div>
  `;
  bindAdminChrome(overlay);
  overlay.querySelector('#refresh').onclick = () => renderAdminResults(overlay);
  overlay.querySelector('#csvRaw').onclick = () => {
    const csv = toCSV(responses, ['session','imageId','truth','guess','correct','ts']);
    downloadCSV(csv, 'astro_survey_raw.csv');
  };
  overlay.querySelector('#csvSummary').onclick = () => {
    const csv = toCSV(summary.map(s=>({
      imageId:s.id, truth:s.truth, shown:s.shown, real:s.real, ai:s.ai, correct:s.correct,
      accuracy: s.shown ? Math.round((s.correct/s.shown)*1000)/10 + '%' : '0%'
    })), ['imageId','truth','shown','real','ai','correct','accuracy']);
    downloadCSV(csv, 'astro_survey_summary.csv');
  };
  overlay.querySelector('#txtSummary').onclick = () => {
    downloadTXT(buildTXTReport(summary, sessions, totalAnswers, totalCorrect, overallRate), 'astro_survey_stats.txt');
  };
}

function buildTXTReport(summary, sessions, totalAnswers, totalCorrect, overallRate){
  const lines = [];
  lines.push('AI 천체사진 판별 설문 - 통계 요약');
  lines.push('생성 시각: ' + new Date().toLocaleString('ko-KR'));
  lines.push('');
  lines.push(`참여 세션 수: ${sessions}`);
  lines.push(`총 응답 수: ${totalAnswers}`);
  lines.push(`전체 정답률: ${overallRate}% (${totalCorrect}/${totalAnswers})`);
  lines.push('');
  lines.push('--- 이미지별 통계 ---');
  summary.forEach(s=>{
    const rate = s.shown ? Math.round((s.correct/s.shown)*1000)/10 : 0;
    lines.push('');
    lines.push(`[${s.id}] 실제로는: ${s.truth === 'REAL' ? '진짜 사진' : 'AI 사진'}`);
    lines.push(`  총 클릭수: ${s.shown}`);
    lines.push(`  O(진짜라고 답함): ${s.real}회`);
    lines.push(`  X(AI라고 답함): ${s.ai}회`);
    lines.push(`  정답률: ${rate}%`);
  });
  return lines.join('\n');
}

function downloadTXT(text, filename){
  const blob = new Blob(['\uFEFF' + text], { type:'text/plain;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function bindAdminChrome(overlay){
  overlay.querySelector('#adminClose').onclick = () => {
    overlay.style.display = 'none';
    startQuiz(); // 관리자가 사진을 바꿨을 수 있으니 새로 불러오기
  };
  overlay.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.onclick = async () => {
      adminTab = btn.dataset.tab;
      if(adminTab === 'photos') await renderAdminPhotos(overlay);
      else await renderAdminResults(overlay);
    };
  });
}
</script>
